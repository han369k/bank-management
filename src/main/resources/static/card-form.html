<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增信用卡</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-wrapper { max-width: 520px; margin: 40px auto; padding: 0 16px; }
    .card-box { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 32px; border: 1px solid #eee; }
    .card-number-group { display: flex; gap: 8px; align-items: center; }
    .card-number-group .form-control { text-align: center; font-family: monospace !important; font-size: 16px !important; letter-spacing: 2px; }
    .form-label { font-size: 12px; font-weight: 600; color: #555; text-transform: uppercase; }
    .form-control:focus, .form-select:focus { border-color: #1a1d23; box-shadow: 0 0 0 0.25rem rgba(26, 29, 35, 0.1); }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="index.html"><i class="bi bi-bank me-2"></i>Bank Management</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link" href="index.html">首頁</a>
      <a class="nav-link active" href="card-list.html">信用卡</a>
      <a class="nav-link" href="card-billcurrent.html">帳單</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="page-title mb-0"><i class="bi bi-plus-circle me-2"></i>新增信用卡</h1>
    <button type="button" class="btn btn-sm btn-outline-info" onclick="fillDemoData()">
      <i class="bi bi-magic me-1"></i>一鍵帶入
    </button>
  </div>

  <div class="card-box">
    <!-- 改為靜態導航 -->
    <form id="creditCardForm" action="card-list.html" method="get">
      <input type="hidden" id="fullCardNumber" name="cardNumber">

      <div class="mb-3">
        <label for="customerId" class="form-label">客戶 ID <span class="text-muted fw-normal">(例: 1)</span></label>
        <input type="number" id="customerId" name="customerId" class="form-control" placeholder="請輸入客戶編號" required>
      </div>

      <div class="mb-3">
        <label for="cardTypeId" class="form-label">卡別 ID <span class="text-muted fw-normal">(1~10)</span></label>
        <input type="number" id="cardTypeId" name="cardTypeId" class="form-control" placeholder="請輸入卡片類型編號" required>
      </div>

      <div class="mb-3">
        <label class="form-label">信用卡號 (16位數字)</label>
        <div class="card-number-group">
          <input type="text" class="form-control card-part" maxlength="4" placeholder="0000" inputmode="numeric" required>
          <span>-</span>
          <input type="text" class="form-control card-part" maxlength="4" placeholder="0000" inputmode="numeric" required>
          <span>-</span>
          <input type="text" class="form-control card-part" maxlength="4" placeholder="0000" inputmode="numeric" required>
          <span>-</span>
          <input type="text" class="form-control card-part" maxlength="4" placeholder="0000" inputmode="numeric" required>
        </div>
        <div id="cardError" class="text-danger small mt-1" style="display:none;">請輸入完整的 16 位數字卡號</div>
      </div>

      <div class="mb-3">
        <label for="expiryDate" class="form-label">到期日</label>
        <input type="date" id="expiryDate" name="expiryDate" class="form-control" required>
      </div>

      <div class="mb-4">
        <label for="cardStatus" class="form-label">初始狀態</label>
        <select id="cardStatus" name="cardStatus" class="form-select" required>
          <option value="" disabled selected>請選擇卡片狀態</option>
          <option value="ACTIVE">有效 (ACTIVE)</option>
          <option value="INACTIVE">尚未啟用 (INACTIVE)</option>
          <option value="BLOCKED">已停用 (BLOCKED)</option>
        </select>
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary py-2">
          <i class="bi bi-check2-circle me-1"></i>確認新增
        </button>
        <a href="card-list.html" class="btn btn-outline-secondary py-2">
          <i class="bi bi-arrow-left me-1"></i>返回列表
        </a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function fillDemoData() {
    document.getElementById('customerId').value = '1';
    document.getElementById('cardTypeId').value = Math.floor(Math.random() * 10) + 1;
    const randomSuffix = Math.floor(Math.random() * 1000000000000).toString().padStart(12, '0');
    const fullCardNumber = '4500' + randomSuffix;
    const parts = document.querySelectorAll('.card-part');
    for (let i = 0; i < 4; i++) {
      parts[i].value = fullCardNumber.substring(i * 4, (i + 1) * 4);
    }
    const futureDate = new Date();
    futureDate.setFullYear(futureDate.getFullYear() + 3);
    document.getElementById('expiryDate').value = futureDate.toISOString().split('T')[0];
    document.getElementById('cardStatus').value = 'ACTIVE';
    document.getElementById('cardError').style.display = 'none';
  }

  document.addEventListener('DOMContentLoaded', function() {
    const parts = document.querySelectorAll('.card-part');
    const form = document.getElementById('creditCardForm');
    const fullCardInput = document.getElementById('fullCardNumber');
    const errorHint = document.getElementById('cardError');

    parts.forEach((el, index) => {
      el.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
        if (this.value.length >= 4 && index < parts.length - 1) {
          parts[index + 1].focus();
        }
      });
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
          parts[index - 1].focus();
        }
      });
      el.addEventListener('paste', function(e) {
        e.preventDefault();
        const data = e.clipboardData.getData('text').replace(/\D/g, '').substring(0, 16);
        for (let i = 0; i < 4; i++) {
          const chunk = data.substring(i * 4, (i + 1) * 4);
          if (parts[i]) parts[i].value = chunk;
        }
        const lastIndex = Math.floor((data.length - 1) / 4);
        if (lastIndex >= 0) parts[Math.min(lastIndex, 3)].focus();
      });
    });

    form.addEventListener('submit', function(e) {
      let fullNumber = "";
      parts.forEach(p => fullNumber += p.value);
      if (fullNumber.length !== 16) { e.preventDefault(); errorHint.style.display = 'block'; parts[0].focus(); }
      else { errorHint.style.display = 'none'; fullCardInput.value = fullNumber; }
    });
  });
</script>
</body>
</html>
