<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增帳戶</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/bank_management/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/bank_management/index.html"><i class="bi bi-bank me-2"></i>Bank Management</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link" href="/bank_management/view?page=account-list">帳戶列表</a>
      <a class="nav-link active" href="/bank_management/view?page=account-create">新增帳戶</a>
      <a class="nav-link" href="/bank_management/view?page=translog-search">交易紀錄</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="page-title">新增帳戶</div>

  <div id="msg"></div>

  <div class="card" style="max-width:520px">
    <div class="card-header">帳戶資料</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-12">
          <label>帳號 <span style="color:#aaa;font-weight:400;text-transform:none">（12碼）</span></label>
          <input id="f-account" class="form-control" type="text" maxlength="12" placeholder="例：000000000001">
        </div>
        <div class="col-12">
          <label>客戶 ID</label>
          <input id="f-customer" class="form-control" type="text" placeholder="客戶身分識別碼">
        </div>
        <div class="col-6">
          <label>類型</label>
          <select id="f-type" class="form-select">
            <option value="CHECKING">CHECKING（活期）</option>
            <option value="SAVINGS">SAVINGS（儲蓄）</option>
          </select>
        </div>
        <div class="col-6">
          <label>幣別</label>
          <select id="f-currency" class="form-select">
            <option value="TWD">TWD</option>
            <option value="USD">USD</option>
            <option value="JPY">JPY</option>
          </select>
        </div>
        <div class="col-6">
          <label>初始餘額</label>
          <input id="f-balance" class="form-control" type="number" min="0" step="1" placeholder="0">
        </div>
        <div class="col-6">
          <label>狀態</label>
          <select id="f-status" class="form-select">
            <option value="ACTIVE">ACTIVE</option>
            <option value="FROZEN">FROZEN</option>
          </select>
        </div>
        <div class="col-12 d-flex gap-2 mt-1">
          <button class="btn btn-primary" onclick="createAccount()">
            <i class="bi bi-plus-lg me-1"></i>建立帳戶
          </button>
          <button class="btn btn-outline-secondary" onclick="clearForm()">清除</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const ctx = '/bank_management';

function showMsg(text, type='danger') {
  document.getElementById('msg').innerHTML =
    `<div class="alert alert-${type} alert-dismissible" role="alert">
       ${text}
       <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
     </div>`;
}

function clearForm() {
  ['f-account','f-customer','f-balance'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-type').value     = 'CHECKING';
  document.getElementById('f-currency').value = 'TWD';
  document.getElementById('f-status').value   = 'ACTIVE';
  document.getElementById('msg').innerHTML    = '';
}

const v = id => document.getElementById(id).value.trim();

async function createAccount() {
  if (!v('f-account'))              { showMsg('帳號為必填'); return; }
  if (v('f-account').length !== 12) { showMsg('帳號必須為 12 碼'); return; }
  if (!v('f-customer'))             { showMsg('客戶 ID 為必填'); return; }
  if (v('f-balance') === '' || Number(v('f-balance')) < 0) {
    showMsg('請輸入有效的初始餘額'); return;
  }

  const body = {
    account:    v('f-account'),
    customerId: v('f-customer'),
    type:       v('f-type'),
    currency:   v('f-currency'),
    balance:    Number(v('f-balance')),
    status:     v('f-status'),
    createAt:   new Date().toISOString().slice(0,19)
  };

  try {
    const res  = await fetch(`${ctx}/account?action=create`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) { showMsg(data.error || '建立失敗'); return; }
    showMsg(`<i class="bi bi-check-circle me-1"></i>${data.message}`, 'success');
    clearForm();
  } catch(e) {
    showMsg('網路錯誤：' + e.message);
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
