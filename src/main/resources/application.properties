spring.application.name=bank-management
server.port=8080
#Spring JPA Setting:
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.hibernate.ddl-auto=update
#SQL Server DataSource Setting:
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bank_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=bot
spring.datasource.password=1452