<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>帳戶詳情</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/bank_management/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/bank_management/index.html"><i class="bi bi-bank me-2"></i>Bank Management</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link active" href="/bank_management/view?page=account-list">帳戶列表</a>
      <a class="nav-link" href="/bank_management/view?page=account-create">新增帳戶</a>
      <a class="nav-link" href="/bank_management/view?page=translog-search">交易紀錄</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="d-flex align-items-center gap-3 mb-3">
    <a href="/bank_management/view?page=account-list" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> 返回列表
    </a>
    <div class="page-title mb-0">帳戶詳情</div>
  </div>

  <div id="msg"></div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      基本資訊
      <a id="link-translog" href="#" class="btn btn-sm btn-outline-secondary" style="font-size:11px">
        <i class="bi bi-list-ul me-1"></i>查看交易紀錄
      </a>
    </div>
    <div class="card-body">
      <div id="info-body" style="color:#aaa">載入中...</div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header">存款</div>
        <div class="card-body">
          <label>金額</label>
          <input id="dep-amount" class="form-control mb-3" type="number" min="1" placeholder="請輸入金額">
          <button class="btn btn-primary" onclick="doDeposit()">
            <i class="bi bi-plus-circle me-1"></i>確認存款
          </button>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header">提款</div>
        <div class="card-body">
          <label>金額</label>
          <input id="wit-amount" class="form-control mb-3" type="number" min="1" placeholder="請輸入金額">
          <button class="btn btn-primary" onclick="doWithdraw()">
            <i class="bi bi-dash-circle me-1"></i>確認提款
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">轉帳</div>
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-sm-4">
          <label>轉入帳號</label>
          <input id="tr-to" class="form-control" type="text" placeholder="目標帳號（12碼）">
        </div>
        <div class="col-sm-3">
          <label>金額</label>
          <input id="tr-amount" class="form-control" type="number" min="1" placeholder="請輸入金額">
        </div>
        <div class="col-sm-3">
          <label>備註</label>
          <input id="tr-note" class="form-control" type="text" placeholder="選填">
        </div>
        <div class="col-sm-2">
          <button class="btn btn-primary w-100" onclick="doTransfer()">
            <i class="bi bi-arrow-left-right me-1"></i>確認轉帳
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="max-width:340px">
    <div class="card-header">更新帳戶狀態</div>
    <div class="card-body">
      <label>新狀態</label>
      <select id="st-status" class="form-select mb-3">
        <option value="ACTIVE">ACTIVE（正常）</option>
        <option value="FROZEN">FROZEN（凍結）</option>
        <option value="CLOSED">CLOSED（註銷）</option>
      </select>
      <button class="btn btn-outline-secondary" onclick="doUpdateStatus()">
        <i class="bi bi-pencil me-1"></i>更新狀態
      </button>
    </div>
  </div>

  <div class="danger-zone" style="max-width:400px">
    <div class="danger-zone card-header-text"><i class="bi bi-exclamation-triangle me-1"></i>刪除帳戶</div>
    <p style="font-size:12px;color:#888;margin-bottom:12px">實務上不應刪除帳戶，僅供 Demo 使用。</p>
    <button class="btn btn-sm btn-danger" onclick="doDelete()">
      <i class="bi bi-trash me-1"></i>實體刪除此帳戶
    </button>
  </div>
</div>

<script>
  const ctx = '/bank_management';
  const account = new URLSearchParams(location.search).get('account');

  if (!account) {
    document.getElementById('msg').innerHTML =
            '<div class="alert alert-danger">未指定帳號，請從列表進入此頁。</div>';
  }

  // 修正：轉向交易紀錄也要透過 ViewServlet
  document.getElementById('link-translog').href =
          `${ctx}/view?page=translog-search&account=${encodeURIComponent(account ?? '')}`;

  function showMsg(text, type='danger') {
    document.getElementById('msg').innerHTML =
            `<div class="alert alert-${type} alert-dismissible" role="alert">
       ${text}
       <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
     </div>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function statusBadge(s) {
    const cls = s === 'ACTIVE' ? 'badge-active' : s === 'FROZEN' ? 'badge-frozen' : 'badge-closed';
    return `<span class="badge-status ${cls}">${s}</span>`;
  }

  async function loadAccount() {
    if (!account) return;
    const res  = await fetch(`${ctx}/account?action=get&account=${encodeURIComponent(account)}`);
    const data = await res.json();
    if (!res.ok) { document.getElementById('info-body').textContent = data.error; return; }

    document.getElementById('st-status').value = data.status;
    document.getElementById('info-body').innerHTML = `
    <table class="info-table">
      <tr><td>帳號</td>     <td><span style="font-family:monospace">${data.account}</span></td></tr>
      <tr><td>客戶 ID</td>  <td>${data.customerId}</td></tr>
      <tr><td>類型</td>     <td>${data.type ?? '-'}</td></tr>
      <tr><td>幣別</td>     <td>${data.currency ?? '-'}</td></tr>
      <tr><td>餘額</td>     <td><strong style="font-size:16px">${Number(data.balance).toLocaleString()}</strong></td></tr>
      <tr><td>狀態</td>     <td>${statusBadge(data.status)}</td></tr>
      <tr><td>建立時間</td> <td>${data.createAt ? data.createAt.replace('T',' ').slice(0,16) : '-'}</td></tr>
    </table>`;
  }

  async function post(action, body) {
    const res  = await fetch(`${ctx}/account?action=${action}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return { ok: res.ok, status: res.status, data: await res.json() };
  }

  async function doDeposit() {
    const amount = document.getElementById('dep-amount').value.trim();
    if (!amount || Number(amount) <= 0) { showMsg('請輸入有效金額'); return; }
    const { ok, status, data } = await post('deposit', { account, amount: Number(amount) });
    if (!ok) { showMsg(`[${status}] ${data.error}`, status === 403 ? 'warning' : 'danger'); return; }
    showMsg(`<i class="bi bi-check-circle me-1"></i>${data.message}`, 'success');
    document.getElementById('dep-amount').value = '';
    loadAccount();
  }

  async function doWithdraw() {
    const amount = document.getElementById('wit-amount').value.trim();
    if (!amount || Number(amount) <= 0) { showMsg('請輸入有效金額'); return; }
    const { ok, status, data } = await post('withdraw', { account, amount: Number(amount) });
    if (!ok) { showMsg(`[${status}] ${data.error}`, status === 403 ? 'warning' : 'danger'); return; }
    showMsg(`<i class="bi bi-check-circle me-1"></i>${data.message}`, 'success');
    document.getElementById('wit-amount').value = '';
    loadAccount();
  }

  async function doTransfer() {
    const toAccount = document.getElementById('tr-to').value.trim();
    const amount    = document.getElementById('tr-amount').value.trim();
    const note      = document.getElementById('tr-note').value.trim();
    if (!toAccount)                    { showMsg('請填入轉入帳號'); return; }
    if (!amount || Number(amount) <= 0){ showMsg('請輸入有效金額'); return; }
    const { ok, status, data } = await post('transfer', {
      fromAccount: account, toAccount, amount: Number(amount), note: note || '轉帳'
    });
    if (!ok) { showMsg(`[${status}] ${data.error}`, status === 403 ? 'warning' : 'danger'); return; }
    showMsg(`<i class="bi bi-check-circle me-1"></i>${data.message}`, 'success');
    ['tr-to','tr-amount','tr-note'].forEach(id => document.getElementById(id).value = '');
    loadAccount();
  }

  async function doUpdateStatus() {
    const status = document.getElementById('st-status').value;
    const { ok, data } = await post('updateStatus', { account, status });
    if (!ok) { showMsg(data.error); return; }
    showMsg(`<i class="bi bi-check-circle me-1"></i>${data.message}`, 'success');
    loadAccount();
  }

  async function doDelete() {
    if (!confirm(`確定要實體刪除帳戶 ${account}？\n此操作不可還原。`)) return;
    const { ok, data } = await post('delete', { account });
    if (!ok) { showMsg(data.error); return; }
    showMsg(`<i class="bi bi-check-circle me-1"></i>${data.message}　3秒後返回列表`, 'success');
    // 修正：返回列表也要透過 ViewServlet
    setTimeout(() => location.href = `${ctx}/view?page=account-list`, 3000);
  }

  loadAccount();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
