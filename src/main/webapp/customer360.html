<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爪哇銀行 — 顧客管理系統</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 頁首 ===== -->
<header class="cust-header">
    <div class="cust-header-inner">
        <h1>🏦 爪哇銀行後台管理系統</h1>
        <span class="cust-subtitle">顧客管理模組 (KYC & Customer Operations)</span>
    </div>
</header>

<main class="cust-main">

    <!-- ===== 區塊一：查詢顧客 ===== -->
    <section class="cust-card">
        <h2 class="cust-section-title">🔍 查詢顧客（用身分證字號）</h2>
        <form id="cust-search-form" action="CustomerServlet" method="get">
            <input type="hidden" name="action" value="search">
            <div class="cust-form-row">
                <label for="cust-search-id">身分證字號</label>
                <input type="text" id="cust-search-id" name="idNumber"
                       placeholder="例：A123456789" maxlength="10">
                <button type="submit" class="cust-btn cust-btn-primary">查詢</button>
                <!-- 查詢全部按鈕：直接用 GET 到 list 動作 -->
                <a href="CustomerServlet?action=list" class="cust-btn cust-btn-secondary">顯示全部</a>
            </div>
            <!-- JavaScript 驗證錯誤訊息顯示區 -->
            <p id="cust-search-error" class="cust-error-msg" style="display:none;"></p>
        </form>
    </section>

    <!-- ===== 區塊二：新增顧客 ===== -->
    <section class="cust-card">
        <h2 class="cust-section-title">➕ 新增顧客</h2>
        <form id="cust-insert-form" action="CustomerServlet" method="post">
            <input type="hidden" name="action" value="insert">

            <div class="cust-form-grid">
                <div class="cust-form-group">
                    <label for="cust-new-id">顧客代號 *</label>
                    <input type="text" id="cust-new-id" name="customerId"
                           placeholder="例：C2026008" required>
                </div>
                <div class="cust-form-group">
                    <label for="cust-new-idno">身分證字號 *</label>
                    <input type="text" id="cust-new-idno" name="idNumber"
                           placeholder="例：A123456789" maxlength="10" required>
                </div>
                <div class="cust-form-group">
                    <label for="cust-new-name">姓名 *</label>
                    <input type="text" id="cust-new-name" name="name"
                           placeholder="例：王小明" required>
                </div>
                <div class="cust-form-group">
                    <label for="cust-new-dob">生日</label>
                    <input type="date" id="cust-new-dob" name="dateOfBirth">
                </div>
                <div class="cust-form-group">
                    <label for="cust-new-phone">電話</label>
                    <input type="text" id="cust-new-phone" name="phone"
                           placeholder="例：0912-345-678">
                </div>
                <div class="cust-form-group">
                    <label for="cust-new-email">Email</label>
                    <input type="email" id="cust-new-email" name="email"
                           placeholder="例：test@gmail.com">
                </div>
                <div class="cust-form-group cust-span-2">
                    <label for="cust-new-addr">地址</label>
                    <input type="text" id="cust-new-addr" name="address"
                           placeholder="例：台北市信義區松智路1號">
                </div>
                <div class="cust-form-group">
                    <label for="cust-new-income">月收入 (元)</label>
                    <input type="number" id="cust-new-income" name="income"
                           placeholder="例：50000" min="0">
                </div>
                <div class="cust-form-group">
                    <label for="cust-new-credit">信用分數</label>
                    <input type="number" id="cust-new-credit" name="creditScore"
                           placeholder="例：700" min="300" max="850">
                </div>
            </div>

            <p id="cust-insert-error" class="cust-error-msg" style="display:none;"></p>
            <div class="cust-form-actions">
                <button type="submit" class="cust-btn cust-btn-success">新增顧客</button>
                <button type="reset" class="cust-btn cust-btn-secondary">清除</button>
            </div>
        </form>
    </section>

    <!-- ===== 區塊三：修改顧客狀態 ===== -->
    <section class="cust-card">
        <h2 class="cust-section-title">✏️ 修改顧客狀態</h2>
        <form id="cust-update-form" action="CustomerServlet" method="post">
            <input type="hidden" name="action" value="update">
            <div class="cust-form-row">
                <label for="cust-upd-id">顧客代號</label>
                <input type="text" id="cust-upd-id" name="customerId"
                       placeholder="例：C2026001">
                <label for="cust-upd-status">新狀態</label>
                <select id="cust-upd-status" name="newStatus" class="cust-select">
                    <option value="Active">Active（正常）</option>
                    <option value="Frozen">Frozen（凍結）</option>
                    <option value="VIP">VIP</option>
                    <option value="Blacklist">Blacklist（黑名單）</option>
                </select>
                <button type="submit" class="cust-btn cust-btn-warning">修改狀態</button>
            </div>
            <p id="cust-update-error" class="cust-error-msg" style="display:none;"></p>
        </form>
    </section>

    <!-- ===== 區塊四：刪除顧客 ===== -->
    <section class="cust-card">
        <h2 class="cust-section-title">🗑️ 刪除顧客</h2>
        <form id="cust-delete-form" action="CustomerServlet" method="post">
            <input type="hidden" name="action" value="delete">
            <div class="cust-form-row">
                <label for="cust-del-id">顧客代號</label>
                <input type="text" id="cust-del-id" name="customerId"
                       placeholder="例：C2026008">
                <button type="submit" class="cust-btn cust-btn-danger"
                        id="cust-delete-btn">刪除顧客</button>
            </div>
            <p id="cust-delete-error" class="cust-error-msg" style="display:none;"></p>
        </form>
    </section>

</main>

<footer class="cust-footer">
    <p>爪哇銀行管理系統 © 2026 | 顧客管理模組 by 以琳</p>
</footer>

<!-- 引入 JavaScript 驗證邏輯 -->
<script src="js/customer.js"></script>

</body>
</html>
