<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .module-card {
      border: none;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      height: 100%;
      transition: box-shadow .15s;
    }
    .module-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); }

    .module-header {
      background: #1a1d23;
      color: #fff;
      border-radius: 8px 8px 0 0;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .module-header .bi { font-size: 18px; opacity: .8; }
    .module-header span { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }

    .module-body { padding: 14px 18px; background: #fff; border-radius: 0 0 8px 8px; }

    .feature-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      text-decoration: none;
      color: #1a1d23;
      font-size: 13px;
      transition: background .12s;
      cursor: pointer;
    }
    .feature-link:hover { background: #f0f2f5; color: #1a1d23; }
    .feature-link.disabled {
      color: #bbb;
      cursor: not-allowed;
      pointer-events: none;
    }
    .feature-link .bi { font-size: 13px; width: 16px; text-align: center; }
    .feature-link .badge-wip {
      margin-left: auto;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      background: #f0f0f0;
      color: #aaa;
      font-weight: 500;
    }

    .divider { border-top: 1px solid #f0f0f0; margin: 6px 0; }

    .hero {
      background: #1a1d23;
      color: #fff;
      border-radius: 8px;
      padding: 28px 32px;
      margin-bottom: 28px;
    }
    .hero h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .hero p  { font-size: 13px; color: #adb5bd; margin: 0; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="index.html"><i class="bi bi-bank me-2"></i>Bank Management</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link active" href="index.html">首頁</a>
      <a class="nav-link" href="view/account-list.html">帳戶</a>
      <a class="nav-link" href="view/translog-search.html">交易紀錄</a>
      <a class="nav-link" href="view/stock-getall.html">股票</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">

  <div class="hero">
    <h1><i class="bi bi-grid-3x3-gap me-2"></i>功能總覽</h1>
    <p>Bank Management System &mdash; 選擇模組以進入對應功能</p>
  </div>

  <div class="row g-3">

    <div class="col-md-4">
      <div class="module-card">
        <div class="module-header">
          <i class="bi bi-people"></i>
          <span>Customer 客戶</span>
        </div>
        <div class="module-body">
          <a class="feature-link" href="view/customer-create.html">
            <i class="bi bi-plus-circle"></i> 新增客戶
          </a>
          <a class="feature-link" href="view/customer-list.html">
            <i class="bi bi-search"></i> 查詢/修改/刪除客戶
          </a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="module-card">
        <div class="module-header">
          <i class="bi bi-wallet2"></i>
          <span>Account 帳戶</span>
        </div>
        <div class="module-body">
          <a class="feature-link" href="view/account-create.html">
            <i class="bi bi-plus-circle"></i> 新增帳戶
          </a>
          <a class="feature-link" href="view/account-list.html">
            <i class="bi bi-search"></i> 查詢帳戶
          </a>
          <a class="feature-link" href="view/account-list.html">
            <i class="bi bi-arrow-left-right"></i> 存提款 / 轉帳
          </a>
          <a class="feature-link" href="view/account-status.html">
            <i class="bi bi-toggle-on"></i> 修改帳戶狀態
          </a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="module-card">
        <div class="module-header">
          <i class="bi bi-list-ul"></i>
          <span>TransLog 交易紀錄</span>
        </div>
        <div class="module-body">
          <a class="feature-link" href="view/translog-search.html">
            <i class="bi bi-search"></i> 查詢交易紀錄
          </a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="module-card">
        <div class="module-header">
          <i class="bi bi-credit-card"></i>
          <span>Card 信用卡</span>
        </div>
        <div class="module-body">
          <a class="feature-link" href="card?action=new">
            <i class="bi bi-plus-circle"></i> 新增信用卡
          </a>
          <a class="feature-link" href="card">
            <i class="bi bi-card-list"></i> 查詢/修改/刪除信用卡
          </a>
          <div class="divider"></div>
          <a class="feature-link" href="view/card-billcurrent.jsp">
            <i class="bi bi-receipt"></i> 查詢當期帳單
          </a>
          <a class="feature-link" href="view/card-billdetail.jsp">
            <i class="bi bi-file-text"></i> 查詢帳單明細
          </a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="module-card">
        <div class="module-header">
          <i class="bi bi-graph-up-arrow"></i>
          <span>Stock 股票</span>
        </div>
        <div class="module-body">
          <a class="feature-link" href="view/stock-create.html">
            <i class="bi bi-plus-circle"></i> 新增股票
          </a>
          <a class="feature-link" href="view/stock-getall.html">
            <i class="bi bi-list-ul"></i> 股票列表 / 查詢單筆
          </a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="module-card">
        <div class="module-header">
          <i class="bi bi-cash-stack"></i>
          <span>Loan 貸款</span>
        </div>
        <div class="module-body">
          <a class="feature-link" href="view/loan-userloanapply.jsp">
            <i class="bi bi-file-earmark-plus"></i> 申請貸款
          </a>
          <a class="feature-link" href="LoanApply">
            <i class="bi bi-check2-circle"></i> 審核 / 查詢貸款總表
          </a>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
