<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貸款申請總表（內部系統）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            padding: 20px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h2 { color: #2f3640; }

        .filter-bar {
            margin: 10px 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-bar label { font-size: 14px; }

        .filter-bar select,
        .filter-bar input {
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .filter-bar input[type=number] { width: 110px; }

        .btn {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }

        .btn-query    { background: #2f3640; color: white; }
        .btn-approve  { background: #44bd32; color: white; }
        .btn-reject   { background: #e84118; color: white; }
        .btn-edit     { background: #0097e6; color: white; }
        .btn-confirm  { background: #44bd32; color: white; }
        .btn-deny     { background: #e84118; color: white; }
        .btn:hover    { opacity: 0.85; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 7px 8px;
            text-align: center;
        }

        th {
            background: #2f3640;
            color: white;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        th:hover { background: #485460; }

        .status { font-weight: bold; }
        .PENDING         { color: orange; }
        .PENDING_CONFIRM { color: #0097e6; }
        .APPROVED        { color: green; }
        .CONFIRMED       { color: #8e44ad; }
        .REJECTED        { color: red; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white;
            padding: 28px;
            border-radius: 8px;
            min-width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal-box h3 { margin-bottom: 16px; color: #2f3640; }
        .form-group { margin: 12px 0; display: flex; align-items: center; }
        .form-group label { width: 90px; font-size: 14px; }
        .form-group input,
        .form-group select { flex: 1; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; }
        .modal-btns { margin-top: 20px; text-align: right; }
        .modal-btns button { padding: 6px 14px; margin-left: 8px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-submit-modal { background: #0097e6; color: white; }
        .btn-cancel       { background: #dcdde1; color: #333; }

        #emptyRow td { color: #888; font-style: italic; }

        /* 分頁列 */
        .pagination-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 0;
            font-size: 14px;
            flex-wrap: wrap;
        }
        .pagination-bar span { color: #555; }
        .pagination-bar select {
            padding: 3px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-refresh { background: #487eb0; color: white; }

        .btn-page {
            width: 28px;
            height: 28px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f0f0f0;
            font-size: 15px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #333;
            transition: background 0.15s;
            user-select: none;
        }
        .btn-page:hover:not(:disabled) { background: #ddd; }
        .btn-page:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .page-info { color: #555; white-space: nowrap; }
    </style>
</head>
<body>

<div class="header-row">
    <h2>📊 貸款申請總表（內部系統）</h2>
    <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-refresh" onclick="loadData()">🔄 刷新</button>
        <div id="deleteZone"></div>
    </div>
</div>

<div class="filter-bar">
    <label>狀態：</label>
    <select id="statusFilter">
        <option value="">全部</option>
        <option value="PENDING">待審核</option>
        <option value="PENDING_CONFIRM">待客戶確認</option>
        <option value="APPROVED">已核准（銀行核准）</option>
        <option value="CONFIRMED">已確認（客戶接受）</option>
        <option value="REJECTED">已拒絕</option>
    </select>

    <label>申請金額：</label>
    <input type="number" id="minAmount" placeholder="最小金額">
    ～
    <input type="number" id="maxAmount" placeholder="最大金額">

    <button class="btn btn-query" onclick="loadData()">查詢</button>
</div>

<div class="pagination-bar" id="paginationTop">
    <span id="totalCount"></span>
    <button class="btn-page" id="btnPrevTop"  onclick="prevPage()" title="上一頁">&#9664;</button>
    <label>頁數：</label>
    <select id="pageSelectTop" onchange="goToPage(parseInt(this.value))"></select>
    <button class="btn-page" id="btnNextTop"  onclick="nextPage()" title="下一頁">&#9654;</button>
    <span class="page-info" id="pageInfoTop"></span>
</div>

<table id="loanTable">
    <thead>
    <tr>
        <th onclick="sortTable(0)">申請編號 <span class="arrow"></span></th>
        <th onclick="sortTable(1)">客戶ID <span class="arrow"></span></th>
        <th onclick="sortTable(2)">貸款種類 <span class="arrow"></span></th>
        <th onclick="sortTable(3)">申請金額 <span class="arrow"></span></th>
        <th onclick="sortTable(4)">期數 <span class="arrow"></span></th>
        <th onclick="sortTable(5)">申請利率 <span class="arrow"></span></th>
        <th onclick="sortTable(6)">建立時間 <span class="arrow"></span></th>
        <th onclick="sortTable(7)">核准金額 <span class="arrow"></span></th>
        <th onclick="sortTable(8)">核准期數 <span class="arrow"></span></th>
        <th onclick="sortTable(9)">核准利率 <span class="arrow"></span></th>
        <th onclick="sortTable(10)">核准人員 <span class="arrow"></span></th>
        <th onclick="sortTable(11)">核准時間 <span class="arrow"></span></th>
        <th onclick="sortTable(12)">狀態 <span class="arrow"></span></th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody id="tableBody">
    <tr id="emptyRow"><td colspan="14">載入中...</td></tr>
    </tbody>
</table>

<div class="pagination-bar" id="paginationBottom" style="justify-content:center;">
    <button class="btn-page" id="btnPrevBottom" onclick="prevPage()" title="上一頁">&#9664;</button>
    <label>頁數：</label>
    <select id="pageSelectBottom" onchange="goToPage(parseInt(this.value))"></select>
    <button class="btn-page" id="btnNextBottom" onclick="nextPage()" title="下一頁">&#9654;</button>
    <span class="page-info" id="pageInfoBottom"></span>
</div>

<!-- Modal：修改方案 -->
<div class="modal-overlay" id="approveModal">
    <div class="modal-box">
        <h3 id="modal_title">📝 修改方案</h3>
        <input type="hidden" id="modal_applicationId">

        <div class="form-group">
            <label>新方案金額</label>
            <input type="number" id="modal_amount" min="1" placeholder="請輸入金額" required>
        </div>

        <div class="form-group">
            <label>新方案期數</label>
            <select id="modal_period"></select>
        </div>

        <div class="form-group">
            <label>審核人員ID</label>
            <input type="number" id="modal_reviewer" value="1" min="1">
        </div>

        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-submit-modal" id="modal_submitBtn" onclick="submitApprove()">送出方案給客戶確認</button>
        </div>
    </div>
</div>

<script>
    const termOptions = {
        PERSONAL:  [12, 24, 36, 48, 60],
        CAR:       [12, 24, 36, 48, 60],
        MOTOR:     [12, 24, 36],
        STUDENT:   [60, 84, 120],
        BUSINESS:  [36, 60, 84],
        HOUSE:     [120, 240, 360, 480],
        LAND:      [120, 180, 240]
    };

    const typeLabel = {
        PERSONAL: '信用貸款', CAR: '汽車車貸', MOTOR: '機車車貸',
        STUDENT: '就學貸款', BUSINESS: '創業貸款', HOUSE: '房屋貸款', LAND: '土地貸款'
    };

    const statusLabel = {
        PENDING: '待審核', PENDING_CONFIRM: '待客戶確認',
        APPROVED: '已核准（銀行核准）', CONFIRMED: '已確認（客戶接受）',
        REJECTED: '已拒絕'
    };

    let allData = [];
    let sortCol = -1, sortAsc = true;
    let currentPage = 1;
    const PAGE_SIZE = 100;

    async function loadData() {
        const status  = document.getElementById('statusFilter').value;
        const minAmt  = document.getElementById('minAmount').value;
        const maxAmt  = document.getElementById('maxAmount').value;

        let url = '/api/loan';
        if (status) {
            url = `/api/loan/search?status=${status}`;
        }

        try {
            const res  = await fetch(url);
            let data   = await res.json();

            if (minAmt) data = data.filter(d => d.applyAmount >= parseInt(minAmt));
            if (maxAmt) data = data.filter(d => d.applyAmount <= parseInt(maxAmt));

            allData = data;
            currentPage = 1;
            renderPage();
        } catch (err) {
            document.getElementById('tableBody').innerHTML =
                `<tr><td colspan="14" style="color:red;">載入失敗：${err.message}</td></tr>`;
        }
    }

    function totalPages() {
        return Math.max(1, Math.ceil(allData.length / PAGE_SIZE));
    }

    function renderPage() {
        const total = allData.length;
        const pages = totalPages();

        // 防呆：頁碼超出範圍時修正
        if (currentPage < 1) currentPage = 1;
        if (currentPage > pages) currentPage = pages;

        const start = (currentPage - 1) * PAGE_SIZE;
        const pageData = allData.slice(start, start + PAGE_SIZE);

        // 更新總筆數
        document.getElementById('totalCount').textContent =
            `共 ${total} 筆`;

        // 更新頁數選單
        ['pageSelectTop', 'pageSelectBottom'].forEach(id => {
            const sel = document.getElementById(id);
            sel.innerHTML = '';
            for (let i = 1; i <= pages; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `第 ${i} 頁`;
                if (i === currentPage) opt.selected = true;
                sel.appendChild(opt);
            }
        });

        // 頁碼文字
        const infoText = `第 ${currentPage} / ${pages} 頁`;
        document.getElementById('pageInfoTop').textContent    = infoText;
        document.getElementById('pageInfoBottom').textContent = infoText;

        // 箭頭防呆：第1頁停用上一頁，最後頁停用下一頁
        const atFirst = currentPage <= 1;
        const atLast  = currentPage >= pages;
        ['btnPrevTop','btnPrevBottom'].forEach(id => {
            document.getElementById(id).disabled = atFirst;
        });
        ['btnNextTop','btnNextBottom'].forEach(id => {
            document.getElementById(id).disabled = atLast;
        });

        renderTable(pageData);
    }

    function goToPage(page) {
        const p = parseInt(page);
        if (isNaN(p)) return;
        currentPage = p;
        renderPage();
    }

    function prevPage() {
        if (currentPage > 1) { currentPage--; renderPage(); }
    }

    function nextPage() {
        if (currentPage < totalPages()) { currentPage++; renderPage(); }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr id="emptyRow"><td colspan="14">目前沒有資料</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(loan => {
            const statusClass = loan.status || '';
            const ops = buildOps(loan);
            return `
            <tr>
                <td>${loan.applicationId || ''}</td>
                <td>${loan.customerId || ''}</td>
                <td>${typeLabel[loan.applyType] || loan.applyType || ''}</td>
                <td>${loan.applyAmount ?? ''}</td>
                <td>${loan.applyPeriod ?? ''}</td>
                <td>${fmtRate(loan.rate)}</td>
                <td>${fmtTime(loan.createTime)}</td>
                <td>${loan.approvedAmount ?? ''}</td>
                <td>${loan.approvedPeriod ?? ''}</td>
                <td>${fmtRate(loan.approvedRate)}</td>
                <td>${loan.reviewerId ?? ''}</td>
                <td>${fmtTime(loan.reviewTime)}</td>
                <td class="status ${statusClass}">${statusLabel[loan.status] || loan.status || ''}</td>
                <td>${ops}</td>
            </tr>`;
        }).join('');
    }

    function buildOps(loan) {
        if (loan.status === 'PENDING') {
            return `
                審核人 <input type="number" id="rv_${loan.applicationId}" value="1" style="width:45px;">
                <button class="btn btn-edit"    onclick="openModal('${loan.applicationId}')">修改方案</button>
                <button class="btn btn-approve" onclick="approveDirect('${loan.applicationId}')">直接核准</button>
                <button class="btn btn-reject"  onclick="rejectByBank('${loan.applicationId}')">拒絕</button>
            `;
        }
        if (loan.status === 'PENDING_CONFIRM') {
            return `
                <button class="btn btn-confirm" onclick="confirmApproval('${loan.applicationId}')">客戶確認</button>
                <button class="btn btn-deny"    onclick="rejectByCustomer('${loan.applicationId}')">客戶拒絕</button>
            `;
        }
        return '–';
    }

    function fmtRate(val) {
        return val ? (parseFloat(val) * 100).toFixed(2) + '%' : '';
    }

    function fmtTime(val) {
        if (!val) return '';
        return val.replace('T', ' ').substring(0, 19);
    }

    function getReviewer(appId) {
        const el = document.getElementById('rv_' + appId);
        return el ? parseInt(el.value) : 1;
    }

    let modalMode = 'submit-confirm';

    function openModalWithMode(appId, mode) {
        const loan = allData.find(d => d.applicationId === appId);
        const applyType = loan ? loan.applyType : '';

        modalMode = mode;

        if (mode === 'approve-direct') {
            document.getElementById('modal_title').textContent = '✅ 直接核准方案';
            document.getElementById('modal_submitBtn').textContent = '直接核准';
        } else {
            document.getElementById('modal_title').textContent = '📝 修改方案';
            document.getElementById('modal_submitBtn').textContent = '送出方案給客戶確認';
        }

        document.getElementById('modal_applicationId').value = appId;
        document.getElementById('modal_amount').value = '';
        document.getElementById('modal_reviewer').value = getReviewer(appId);

        const sel = document.getElementById('modal_period');
        sel.innerHTML = '';
        (termOptions[applyType] || []).forEach(t => {
            const opt = document.createElement('option');
            opt.value = t; opt.textContent = t + '期';
            sel.appendChild(opt);
        });

        document.getElementById('approveModal').classList.add('active');
    }

    // 直接核准
    function approveDirect(appId) {
        openModalWithMode(appId, 'approve-direct');
    }

    // 銀行拒絕
    async function rejectByBank(appId) {
        const reviewerId = getReviewer(appId);
        const res = await fetch(`/api/loan/${appId}/reject-by-bank`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reviewerId })
        });
        (await res.ok) ? alert('已拒絕') : alert('操作失敗');
        loadData();
    }

    // 客戶同意方案
    async function confirmApproval(appId) {
        const res = await fetch(`/api/loan/${appId}/confirm`, { method: 'PUT' });
        (await res.ok) ? alert('客戶已確認') : alert('操作失敗');
        loadData();
    }

    // 客戶拒絕方案
    async function rejectByCustomer(appId) {
        const res = await fetch(`/api/loan/${appId}/reject-by-customer`, { method: 'PUT' });
        (await res.ok) ? alert('客戶已拒絕') : alert('操作失敗');
        loadData();
    }

    // 修改方案送客戶確認
    function openModal(appId) {
        openModalWithMode(appId, 'submit-confirm');
    }

    function closeModal() {
        document.getElementById('approveModal').classList.remove('active');
    }
    async function submitApprove() {
        const appId      = document.getElementById('modal_applicationId').value;
        const amount     = parseInt(document.getElementById('modal_amount').value);
        const period     = parseInt(document.getElementById('modal_period').value);
        const reviewerId = parseInt(document.getElementById('modal_reviewer').value);

        if (!amount || amount <= 0) { alert('請輸入有效的方案金額'); return; }
        const endpoint = modalMode === 'approve-direct'
            ? `/api/loan/${appId}/approve-direct`
            : `/api/loan/${appId}/submit-confirm`;

        const res = await fetch(endpoint, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ approvedAmount: amount, approvedPeriod: period, reviewerId })
        });

        closeModal();

        if (res.ok) {
            alert(modalMode === 'approve-direct' ? '已直接核准' : '已送出方案，待客戶確認');
        } else {
            alert('操作失敗');
        }

        loadData();
    }

    const colKeys = [
        'applicationId','customerId','applyType','applyAmount','applyPeriod',
        'rate','createTime','approvedAmount','approvedPeriod','approvedRate',
        'reviewerId','reviewTime','status'
    ];

    function sortTable(colIndex) {
        if (colIndex >= colKeys.length) return; // 操作欄不排序

        sortAsc = (sortCol === colIndex) ? !sortAsc : true;
        sortCol = colIndex;

        const key = colKeys[colIndex];
        allData.sort((a, b) => {
            let vA = a[key] ?? '';
            let vB = b[key] ?? '';
            // 數字型欄位
            if (typeof vA === 'number' && typeof vB === 'number') {
                return sortAsc ? vA - vB : vB - vA;
            }
            vA = String(vA); vB = String(vB);
            const nA = parseFloat(vA.replace(/[%,]/g, ''));
            const nB = parseFloat(vB.replace(/[%,]/g, ''));
            if (!isNaN(nA) && !isNaN(nB)) return sortAsc ? nA - nB : nB - nA;
            if (!vA && vB) return 1;
            if (vA && !vB) return -1;
            return sortAsc ? vA.localeCompare(vB, 'zh-TW') : vB.localeCompare(vA, 'zh-TW');
        });

        // 更新排序箭頭
        document.querySelectorAll('th .arrow').forEach(el => el.textContent = '');
        const arrows = document.querySelectorAll('#loanTable th .arrow');
        if (arrows[colIndex]) arrows[colIndex].textContent = sortAsc ? ' ▲' : ' ▼';

        currentPage = 1;
        renderPage();
    }

    // 初始載入
    loadData();

    // 狀態選單即時刷新
    document.getElementById('statusFilter').addEventListener('change', function () {
        loadData();
    });
</script>

</body>
</html>
