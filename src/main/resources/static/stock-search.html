<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>查詢單筆股票 - Bank Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="index.html"><i class="bi bi-bank me-2"></i>Bank Management</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link" href="index.html">首頁</a>
      <a class="nav-link" href="account-list.html">帳戶</a>
      <a class="nav-link" href="translog-search.html">交易紀錄</a>
      <a class="nav-link active" href="stock-getall.html">股票</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="page-title"><i class="bi bi-search me-2"></i>查詢單筆股票</h2>
        <p class="text-muted small mb-0">輸入股票代碼以尋找特定資料 (此功能已整合至股票列表頁，此頁僅作展示用)</p>
      </div>
      <a href="stock-getall.html" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>返回列表
      </a>
    </div>

    <div class="card card-custom mb-4">
      <div class="card-body p-4">
        <div class="row g-3 align-items-end">
          <div class="col-md-6">
            <label for="stockIdInput" class="form-label text-muted small">股票代碼</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-hash"></i></span>
              <input type="text" id="stockIdInput" class="form-control" placeholder="例如: 2330">
            </div>
          </div>
          <div class="col-md-6">
            <button class="btn btn-primary" onclick="searchStock()" id="searchBtn">
              <i class="bi bi-search me-1"></i>執行查詢
            </button>
          </div>
        </div>
        <div id="searchMessage" class="mt-2 small d-none"></div>
      </div>
    </div>

    <div class="card card-custom" id="resultCard" style="display: none;">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 custom-table">
            <thead>
              <tr>
                <th width="30%">股號 <span class="text-muted fw-normal ms-1">ID</span></th>
                <th width="70%">股名 <span class="text-muted fw-normal ms-1">Name</span></th>
              </tr>
            </thead>
            <tbody id="stockTableBody">
              <!-- 結果由 JS 動態生成 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function searchStock() {
    const id = document.getElementById("stockIdInput").value.trim();
    const msgBox = document.getElementById("searchMessage");
    const resultCard = document.getElementById("resultCard");
    const btn = document.getElementById("searchBtn");

    if (!id) {
      msgBox.className = "mt-2 small text-danger";
      msgBox.innerHTML = "<i class='bi bi-exclamation-circle me-1'></i>請輸入股號";
      msgBox.classList.remove("d-none");
      return;
    }

    // UI 狀態更新
    msgBox.classList.add("d-none");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>查詢中...';
    resultCard.style.display = 'block';

    const tbody = document.getElementById("stockTableBody");
    tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm me-2" role="status"></div>正在向伺服器請求資料...</td></tr>';

    fetch('Stock?method=Search', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({stockId: id})
    })
    .then(response => {
      if (!response.ok) {
        if(response.status === 404 || response.status === 500) {
            throw new Error("找不到股票代碼為 " + id + " 的資料");
        }
        throw new Error("網路回應不成功，狀態碼: " + response.status);
      }
      return response.json();
    })
    .then(stockData => {
      tbody.innerHTML = "";

      if (stockData && stockData.stockId) {
        const tr = document.createElement("tr");

        const codeTd = document.createElement("td");
        codeTd.innerHTML = `<span class="badge bg-light text-dark border font-monospace">${stockData.stockId}</span>`;

        const nameTd = document.createElement("td");
        nameTd.className = "fw-medium";
        nameTd.textContent = stockData.stockName;

        tr.appendChild(codeTd);
        tr.appendChild(nameTd);
        tbody.appendChild(tr);

        // 顯示成功訊息
        msgBox.className = "mt-2 small text-success";
        msgBox.innerHTML = "<i class='bi bi-check-circle me-1'></i>查詢成功";
        msgBox.classList.remove("d-none");
      } else {
        throw new Error("找不到符合條件的股票");
      }
    })
    .catch(error => {
      console.error("發生錯誤:", error);
      tbody.innerHTML = `<tr><td colspan="2" class="text-center text-danger py-4"><i class="bi bi-exclamation-triangle me-2"></i>${error.message}</td></tr>`;
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-search me-1"></i>執行查詢';
    });
  }

  // Enter 鍵觸發查詢
  document.getElementById("stockIdInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      searchStock();
    }
  });
</script>
</body>
</html>
