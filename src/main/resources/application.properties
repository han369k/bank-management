spring.application.name=java-bank-management

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bankDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=nor
spring.datasource.password=9981!Secure

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

spring.security.user.name=admin
spring.security.user.password=1234
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.security=DEBUG

server.port=8080
server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8