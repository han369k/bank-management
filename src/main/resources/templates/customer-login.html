<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登入 - Java Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
    
    <div class="card p-4 shadow-sm" style="width: 25rem;">
        <h3 class="text-center mb-4">🏦 Java Bank<br><small class="text-muted">核心財富管理系統</small></h3>
        
        <div th:if="${param.error}" class="alert alert-danger py-2">❌ 帳號或密碼錯誤！</div>
        <div th:if="${param.logout}" class="alert alert-success py-2">✅ 您已成功登出。</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">員工帳號 (Username)</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">密碼 (Password)</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">登入系統</button>
        </form>
    </div>

</body>
</html>
