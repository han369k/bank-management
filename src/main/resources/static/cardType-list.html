<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Card Types</title>
    
    <style>
      body {
        font-family: Arial;
        background: #f5f5f5;
      }
      
  .container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
  }
  
  .card {
    width: 220px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    overflow: hidden;
    transition: 0.2s;
  }
  
  .card:hover {
    transform: translateY(-5px);
  }
  
  .card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
  }
  
  .card-body {
    padding: 10px;
  }
  
  .card-title {
    font-weight: bold;
    margin-bottom: 8px;
  }
  
  .card a {
    text-decoration: none;
    color: black;
  }
  
  </style>
</head>

<body>
  
  <h2>💳 卡片類型列表</h2>
  <div id="cardTypes" class="container"></div>
  
  <script>
  //http://localhost:8080/cardType-list.html
fetch('/card/types')
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('cardTypes');

    data.forEach(cardType => {
      const div = document.createElement('div');
      div.className = 'card';

      div.innerHTML = `
        <a href="cardType-detail.html?id=${cardType.cardTypeId}">
          <img src="${cardType.cardImageUrl ?? 'https://via.placeholder.com/200x140'}">
          <div class="card-body">
            <div class="card-title">${cardType.cardTypeName}</div>
            <div>Brand: ${cardType.brand ?? 'N/A'}</div>
          </div>
        </a>
      `;

      container.appendChild(div);
    });
  })
  .catch(err => {
    console.error(err);
    alert('抓取卡片列表失敗');
  });
</script>

</body>
</html>
