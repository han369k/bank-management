<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增顧客 - Java Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 800px;">

    <h2 class="mb-4">➕ 新增顧客資料</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/customer/save}" method="post" class="border p-4 rounded shadow-sm bg-light">
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">姓名 <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" placeholder="例: 王大明" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">身分證字號 <span class="text-danger">*</span></label>
                <input type="text" name="idNumber" class="form-control" maxlength="10" placeholder="例: A123456789" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label fw-bold">出生年月日</label>
                <input type="date" name="dateOfBirth" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">聯絡電話</label>
                <input type="text" name="phone" class="form-control" placeholder="例: 0912345678">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">電子信箱</label>
                <input type="email" name="email" class="form-control" placeholder="example@email.com">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">通訊地址</label>
            <input type="text" name="address" class="form-control">
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <label class="form-label fw-bold">月收入 (TWD)</label>
                <input type="number" name="income" class="form-control" step="1000" min="0">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">初始信用分數</label>
                <input type="number" name="creditScore" class="form-control" value="0" min="0" max="800">
            </div>
        </div>

        <div class="d-flex justify-content-end mt-4">
            <a th:href="@{/customer}" class="btn btn-outline-secondary me-2">取消返回</a>
            <button type="submit" class="btn btn-success">✅ 確認新增</button>
        </div>
    </form>
</body>
</html>
