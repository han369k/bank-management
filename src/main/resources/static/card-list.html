<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>信用卡列表</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .page-wrapper { max-width: 1100px; margin: 32px auto; padding: 0 16px; }
    .card-box { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 24px; border: 1px solid #eee; }
    .edit-field:disabled { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; color: #1a1d23; cursor: default; }
    .edit-field { border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; font-size: 13px; width: 100%; transition: all 0.2s; }
    .table thead th { font-size: 12px !important; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="index.html"><i class="bi bi-bank me-2"></i>Bank Management</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link" href="index.html">首頁</a>
      <a class="nav-link active" href="card-list.html">信用卡</a>
      <a class="nav-link" href="card-billcurrent.html">帳單</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h1 class="page-title mb-0"><i class="bi bi-credit-card me-2"></i>信用卡管理</h1>
    <a href="card-form.html" class="btn btn-primary btn-sm">
      <i class="bi bi-plus-circle me-1"></i>新增信用卡
    </a>
  </div>

  <div class="card-box">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
        <tr>
          <th style="width: 80px;">ID</th>
          <th style="width: 100px;">客戶ID</th>
          <th style="width: 100px;">卡別</th>
          <th>信用卡號</th>
          <th>到期日</th>
          <th style="width: 150px;">狀態</th>
          <th style="width: 180px;" class="text-center">操作</th>
        </tr>
        </thead>
        <tbody>
        <!-- Mock Row 1 -->
        <tr>
          <td class="font-monospace text-muted">1</td>
          <td><input type="text" name="customerId" value="C00001" class="edit-field" disabled></td>
          <td><input type="text" name="cardTypeId" value="1" class="edit-field" disabled></td>
          <td class="font-monospace">
            <span class="text-muted">**** **** ****</span> 3456
            <input type="hidden" name="cardNumber" value="4500123456783456">
          </td>
          <td><input type="date" name="expiryDate" value="2027-12-31" class="edit-field" disabled></td>
          <td>
            <select name="cardStatus" class="form-select form-select-sm edit-field" disabled>
              <option value="ACTIVE" selected>🟢 有效 (ACTIVE)</option>
              <option value="INACTIVE">🟡 尚未啟用 (INACTIVE)</option>
              <option value="BLOCKED">🔴 已停用 (BLOCKED)</option>
            </select>
          </td>
          <td class="text-center">
            <button type="button" class="btn btn-sm btn-outline-secondary edit-btn"><i class="bi bi-pencil me-1"></i>修改</button>
            <button type="button" class="btn btn-sm btn-success save-btn" style="display:none;" onclick="submitUpdate(this, '1')"><i class="bi bi-check2 me-1"></i>儲存</button>
            <button type="button" class="btn btn-sm btn-outline-danger delete-btn ms-1" onclick="confirmDelete('1')"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
        <!-- Mock Row 2 -->
        <tr>
          <td class="font-monospace text-muted">2</td>
          <td><input type="text" name="customerId" value="C00002" class="edit-field" disabled></td>
          <td><input type="text" name="cardTypeId" value="2" class="edit-field" disabled></td>
          <td class="font-monospace">
            <span class="text-muted">**** **** ****</span> 8899
            <input type="hidden" name="cardNumber" value="5100123456788899">
          </td>
          <td><input type="date" name="expiryDate" value="2025-05-31" class="edit-field" disabled></td>
          <td>
            <select name="cardStatus" class="form-select form-select-sm edit-field" disabled>
              <option value="ACTIVE">🟢 有效 (ACTIVE)</option>
              <option value="INACTIVE">🟡 尚未啟用 (INACTIVE)</option>
              <option value="BLOCKED" selected>🔴 已停用 (BLOCKED)</option>
            </select>
          </td>
          <td class="text-center">
            <button type="button" class="btn btn-sm btn-outline-secondary edit-btn"><i class="bi bi-pencil me-1"></i>修改</button>
            <button type="button" class="btn btn-sm btn-success save-btn" style="display:none;" onclick="submitUpdate(this, '2')"><i class="bi bi-check2 me-1"></i>儲存</button>
            <button type="button" class="btn btn-sm btn-outline-danger delete-btn ms-1" onclick="confirmDelete('2')"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const Toast = Swal.mixin({
    toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, timerProgressBar: true
  });

  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', function () {
      const tr = this.closest('tr');
      tr.querySelectorAll('.edit-field').forEach(el => el.disabled = false);
      this.style.display = 'none';
      tr.querySelector('.save-btn').style.display = 'inline-block';
      tr.classList.add('table-warning');
    });
  });

  function confirmDelete(id) {
    Swal.fire({
      title: '確定要刪除嗎？',
      text: "刪除後將無法恢復此卡片資料！",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#1a1d23',
      cancelButtonColor: '#d33',
      confirmButtonText: '確定刪除',
      cancelButtonText: '取消'
    }).then((result) => {
      if (result.isConfirmed) {
        Toast.fire({ icon: 'success', title: '已刪除' });
      }
    })
  }

  function submitUpdate(btn, id) {
    const tr = btn.closest('tr');
    Toast.fire({ icon: 'info', title: '正在提交修改...' });
    setTimeout(() => {
        tr.querySelectorAll('.edit-field').forEach(el => el.disabled = true);
        btn.style.display = 'none';
        tr.querySelector('.edit-btn').style.display = 'inline-block';
        tr.classList.remove('table-warning');
        Toast.fire({ icon: 'success', title: '修改成功' });
    }, 500);
  }
</script>
</body>
</html>
