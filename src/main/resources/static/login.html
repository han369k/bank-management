<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系統登入 - Bank Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: #f0f2f5 !important;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 400px;
      padding: 40px 32px;
    }
    .brand-logo {
      font-size: 42px;
      color: #1a1d23;
      margin-bottom: 8px;
      text-align: center;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 600;
      color: #1a1d23;
      text-align: center;
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }
    .btn-login {
      background: #1a1d23;
      color: #fff;
      font-weight: 500;
      padding: 10px;
      border-radius: 6px;
      border: none;
      width: 100%;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn-login:hover {
      background: #2d3139;
    }
    .demo-hint {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed #eee;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand-logo"><i class="bi bi-bank"></i></div>
  <div class="brand-title">Bank Management</div>

  <div id="alert-box"></div>

  <form id="loginForm">
    <div class="mb-3">
      <label class="form-label text-muted small fw-bold">帳號 (Username)</label>
      <input type="text" id="username" class="form-control" placeholder="請輸入行員帳號" required>
    </div>
    <div class="mb-4">
      <label class="form-label text-muted small fw-bold">密碼 (Password)</label>
      <input type="password" id="password" class="form-control" placeholder="請輸入密碼" required>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">
      登入系統
    </button>
  </form>

  <div class="demo-hint">
    <p class="mb-1 fw-bold"><i class="bi bi-info-circle me-1"></i>Demo 測試帳號</p>
    <span class="font-monospace">帳號: admin123</span><br>
    <span class="font-monospace">密碼: test123</span>
    <div class="mt-2">
      <button type="button" class="btn btn-sm btn-outline-secondary py-0" style="font-size: 11px;" onclick="fillDemo()">一鍵帶入</button>
    </div>
  </div>
</div>

<script>
  function showMsg(msg, type = 'danger') {
    document.getElementById('alert-box').innerHTML = 
      `<div class="alert alert-${type} alert-dismissible py-2 shadow-sm" style="font-size:13px" role="alert">
         ${msg}
         <button type="button" class="btn-close" style="padding: 10px;" data-bs-dismiss="alert"></button>
       </div>`;
  }

  function fillDemo() {
    document.getElementById('username').value = 'admin123';
    document.getElementById('password').value = 'test123';
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    const btn = document.getElementById('loginBtn');
    
    if (!u || !p) {
      showMsg('請輸入帳號與密碼');
      return;
    }

    const originalBtnText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>驗證中...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      
      const data = await res.json();
      
      if (res.ok) {
        showMsg('<i class="bi bi-check-circle me-1"></i>登入成功，正在導向...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 500);
      } else {
        showMsg(`<i class="bi bi-exclamation-triangle me-1"></i>${data.error || '登入失敗'}`);
        btn.disabled = false;
        btn.innerHTML = originalBtnText;
      }
    } catch (err) {
      showMsg('網路連線異常，請稍後再試');
      btn.disabled = false;
      btn.innerHTML = originalBtnText;
    }
  });
</script>
</body>
</html>
