<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交易紀錄查詢</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/bank_management/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/bank_management/index.html"><i class="bi bi-bank me-2"></i>Bank Management</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link" href="account-list.html">帳戶列表</a>
      <a class="nav-link" href="account-create.html">新增帳戶</a>
      <a class="nav-link active" href="translog-search.html">交易紀錄</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="page-title">交易紀錄查詢</div>

  <div id="msg"></div>

  <div class="card">
    <div class="card-header">搜尋條件</div>
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-sm-3">
          <label>帳號</label>
          <input id="f-account" class="form-control" type="text" placeholder="留空不篩選">
        </div>
        <div class="col-sm-3">
          <label>客戶 ID</label>
          <input id="f-customer" class="form-control" type="text" placeholder="留空不篩選">
        </div>
        <div class="col-sm-2">
          <label>開始日期</label>
          <input id="f-start" class="form-control" type="date">
        </div>
        <div class="col-sm-2">
          <label>結束日期</label>
          <input id="f-end" class="form-control" type="date">
        </div>
        <div class="col-sm-2 d-flex gap-2">
          <button class="btn btn-primary" onclick="search(1)">
            <i class="bi bi-search me-1"></i>查詢
          </button>
          <button class="btn btn-outline-secondary" onclick="clearForm()">清除</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <div class="d-flex justify-content-between align-items-center px-3 pt-3 pb-2">
        <span id="total-info" style="font-size:12px;color:#888"></span>
      </div>
      <div class="table-wrapper">
        <table class="table mb-0">
          <thead>
            <tr>
              <th>Reference ID</th>
              <th>時間</th>
              <th>類型</th>
              <th>操作帳號</th>
              <th>對象帳號</th>
              <th>金額</th>
              <th>交易後餘額</th>
              <th>備註</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="empty" class="empty-state" style="display:none">
          <i class="bi bi-inbox me-2"></i>查無資料
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center px-3 py-3">
        <span id="page-info" style="font-size:12px;color:#888"></span>
        <nav>
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" id="li-prev">
              <a class="page-link" href="#" onclick="changePage(-1)">
                <i class="bi bi-chevron-left"></i>
              </a>
            </li>
            <li class="page-item disabled" id="li-page">
              <span class="page-link" id="page-num">-</span>
            </li>
            <li class="page-item" id="li-next">
              <a class="page-link" href="#" onclick="changePage(1)">
                <i class="bi bi-chevron-right"></i>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>

<script>
const ctx = '/bank-management';
const PAGE_SIZE = 50;
let currentPage = 1;
let totalCount  = 0;

function showMsg(text, type='danger') {
  document.getElementById('msg').innerHTML =
    `<div class="alert alert-${type} alert-dismissible" role="alert">
       ${text}
       <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
     </div>`;
}

const v = id => document.getElementById(id).value.trim();

function clearForm() {
  ['f-account','f-customer','f-start','f-end'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('msg').innerHTML = '';
  document.getElementById('tbody').innerHTML = '';
  document.getElementById('empty').style.display = 'none';
  document.getElementById('total-info').textContent = '';
  document.getElementById('page-info').textContent  = '';
}

function buildParams(extra) {
  const p = new URLSearchParams(extra);
  if (v('f-account'))  p.set('account',    v('f-account'));
  if (v('f-customer')) p.set('customerId', v('f-customer'));
  if (v('f-start'))    p.set('startDate',  v('f-start'));
  if (v('f-end'))      p.set('endDate',    v('f-end'));
  return p;
}

const typeLabel = t => ({ DEPOSIT:'存款', WITHDRAW:'提款', TRANSFER_OUT:'轉出', TRANSFER_IN:'轉入' }[t] ?? t);
const typeBadge = t => {
  const colors = { DEPOSIT:'success', WITHDRAW:'danger', TRANSFER_OUT:'warning', TRANSFER_IN:'info' };
  return `<span class="badge text-bg-${colors[t] ?? 'secondary'}" style="font-size:11px">${typeLabel(t)}</span>`;
};

async function search(page) {
  currentPage = page;
  document.getElementById('msg').innerHTML = '';

  try {
    const [resData, resCount] = await Promise.all([
      fetch(`${ctx}/translog?${buildParams({ action:'search', page })}`),
      fetch(`${ctx}/translog?${buildParams({ action:'count' })}`)
    ]);
    const data  = await resData.json();
    const count = await resCount.json();

    if (!resData.ok)  { showMsg(data.error  || '查詢失敗'); return; }
    if (!resCount.ok) { showMsg(count.error || '計數失敗'); return; }

    totalCount = count.total;
    const totalPages = Math.ceil(totalCount / PAGE_SIZE) || 1;

    document.getElementById('total-info').textContent = `共 ${totalCount} 筆`;
    document.getElementById('page-num').textContent   = `${page} / ${totalPages}`;
    document.getElementById('page-info').textContent  = `第 ${page} 頁，共 ${totalPages} 頁`;
    document.getElementById('li-prev').classList.toggle('disabled', page <= 1);
    document.getElementById('li-next').classList.toggle('disabled', page >= totalPages);

    const tbody = document.getElementById('tbody');
    const empty = document.getElementById('empty');
    tbody.innerHTML = '';

    if (!data.length) { empty.style.display = ''; return; }
    empty.style.display = 'none';

    data.forEach(log => {
      const time   = log.transactionTime ? log.transactionTime.replace('T',' ').slice(0,16) : '-';
      const amount = Number(log.amount);
      const amtHtml = `<span class="${amount >= 0 ? 'amount-pos' : 'amount-neg'}">${amount >= 0 ? '+' : ''}${amount.toLocaleString()}</span>`;
      tbody.insertAdjacentHTML('beforeend', `
        <tr>
          <td><span class="ref-id" title="${log.referenceId}">${log.referenceId.slice(0,8)}…</span></td>
          <td>${time}</td>
          <td>${typeBadge(log.type)}</td>
          <td><span style="font-family:monospace;font-size:12px">${log.operationAccount}</span></td>
          <td><span style="font-family:monospace;font-size:12px">${log.otherAccount ?? '-'}</span></td>
          <td>${amtHtml}</td>
          <td>${Number(log.balance).toLocaleString()}</td>
          <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${log.note ?? ''}">${log.note ?? '-'}</td>
          <td>
            <button class="btn btn-sm btn-outline-danger" onclick="doDelete('${log.referenceId}')">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>`);
    });
  } catch(e) {
    showMsg('網路錯誤：' + e.message);
  }
}

function changePage(delta) {
  const totalPages = Math.ceil(totalCount / PAGE_SIZE) || 1;
  const next = currentPage + delta;
  if (next < 1 || next > totalPages) return;
  search(next);
}

async function doDelete(referenceId) {
  if (!confirm(`確定刪除此筆交易紀錄？\n${referenceId}\n\n⚠ 僅供 Demo 使用。`)) return;
  try {
    const res  = await fetch(`${ctx}/translog?action=delete`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ referenceId })
    });
    const data = await res.json();
    if (!res.ok) { showMsg(data.error); return; }
    showMsg(`<i class="bi bi-check-circle me-1"></i>${data.message}`, 'success');
    search(currentPage);
  } catch(e) {
    showMsg('網路錯誤：' + e.message);
  }
}

const pre = new URLSearchParams(location.search).get('account');
if (pre) { document.getElementById('f-account').value = pre; search(1); }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
