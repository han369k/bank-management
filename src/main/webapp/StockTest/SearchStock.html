<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>查詢單筆</title>
</head>
<body>
<header><h2>查詢單筆股票</h2></header>
<input type="text" id="stockIdInput" placeholder="輸入股號">
<button onclick="searchStock()">查詢</button>
<table id="stockTable">
    <tr>
        <th>股名</th>
        <th>股號</th>
    </tr>
    <tbody id="stockTableBody">
    </tbody>

</table>
<script>
    function searchStock() {
        const stockId = document.getElementById('stockIdInput').value;
        fetch(`/stocks/${stockId}`)
            .then(response => response.json())
            .then(stock => {
                const tableBody = document.getElementById('stockTableBody');
                tableBody.innerHTML = ''; // 清空表格
                const row = `<tr><td>${stock.name}</td><td>${stock.id}</td></tr>`;
                tableBody.innerHTML += row; // 添加新行
            })
            .catch(error => console.error('Error fetching stock:', error));
    }</script>
</body>
</html>
