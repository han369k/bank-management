<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Card Types</title>

<style>
  body {
    font-family: Arial;
    background: #f5f5f5;
  }

  .container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
  }

  .card {
    width: 220px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    overflow: hidden;
    transition: 0.2s;
  }

  .card:hover {
    transform: translateY(-5px);
  }

  .card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
  }

  .card-body {
    padding: 10px;
  }

  .card-title {
    font-weight: bold;
    margin-bottom: 8px;
  }

  .actions {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
  }

  button {
    padding: 5px 8px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  .delete-btn {
    background: #ff4d4f;
    color: white;
  }

  .edit-btn {
    background: #1890ff;
    color: white;
  }

</style>

</head>

<body>

<h2>💳 卡片類型列表</h2>
<div id="cardTypes" class="container"></div>

<script>

// 取得卡片列表
fetch('/card/types')
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('cardTypes');

    data.forEach(cardType => {
      const div = document.createElement('div');
      div.className = 'card';

      div.innerHTML = `
        <img src="${cardType.cardImageUrl ?? 'https://via.placeholder.com/200x140'}">

        <div class="card-body">
          <div class="card-title">${cardType.cardTypeName}</div>
          <div>Brand: ${cardType.brand ?? 'N/A'}</div>

          <div class="actions">
            <button class="delete-btn" onclick="remove(${cardType.cardTypeId})">刪除</button>
            <button class="edit-btn" onclick="goEdit(${cardType.cardTypeId})">修改</button>
          </div>
        </div>
      `;

      container.appendChild(div);
    });
  })
  .catch(err => {
    console.error(err);
    alert('抓取卡片列表失敗');
  });


// 刪除
function remove(id) {
  if (!confirm("確定要刪除嗎？")) return;

  fetch(`/card/types/${id}`, {
  method: "DELETE"
})
.then(res => {
  if (!res.ok) {
    return res.text().then(msg => { throw new Error(msg) });
  }
  return res.text();
})
.then(() => {
  alert("刪除成功");
  location.reload();
})
.catch(err => {
  alert("刪除失敗：" + err.message);
});
}


// 跳轉修改頁
function goEdit(id) {
  window.location.href = `cardType-create.html?id=${id}`;
}

</script>

</body>
</html>
