<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增顧客 - Bank Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="index.html"><i class="bi bi-bank me-2"></i>Bank Management</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link" href="index.html">首頁</a>
      <a class="nav-link active" href="customer-list.html">客戶</a>
      <a class="nav-link" href="account-list.html">帳戶</a>
      <a class="nav-link" href="translog-search.html">交易紀錄</a>
    </div>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="#" onclick="doLogout()" style="color: #ff6b6b !important;"><i class="bi bi-box-arrow-right me-1"></i>登出系統</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="page-title"><i class="bi bi-person-plus me-2"></i>新增顧客資料</div>

  <div id="msg"></div>

  <div class="card" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>填寫基本資料</span>
      <button type="button" class="btn btn-sm btn-outline-info" onclick="fillDemo()">
        <i class="bi bi-magic me-1"></i>一鍵帶入
      </button>
    </div>
    <div class="card-body">
      <form id="createForm" onsubmit="event.preventDefault(); createCustomer();">
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">姓名 <span class="text-danger">*</span></label>
            <input type="text" id="f-name" class="form-control" placeholder="例: 王大明" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">身分證字號 <span class="text-danger">*</span></label>
            <input type="text" id="f-idNumber" class="form-control" maxlength="10" placeholder="例: A123456789" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">出生年月日</label>
            <input type="date" id="f-dob" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">聯絡電話</label>
            <input type="text" id="f-phone" class="form-control" placeholder="例: 0912345678">
          </div>
          <div class="col-md-4">
            <label class="form-label">電子信箱</label>
            <input type="email" id="f-email" class="form-control" placeholder="example@email.com">
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-12">
            <label class="form-label">通訊地址</label>
            <input type="text" id="f-address" class="form-control" placeholder="例: 台北市信義區...">
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label class="form-label">國籍</label>
            <input type="text" id="f-nationality" class="form-control" value="Taiwan">
          </div>
          <div class="col-md-4">
            <label class="form-label">月收入 (TWD)</label>
            <input type="number" id="f-income" class="form-control" step="1000" min="0" placeholder="0">
          </div>
          <div class="col-md-4">
            <label class="form-label">初始信用分數</label>
            <input type="number" id="f-creditScore" class="form-control" value="0" min="0" max="800">
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a href="customer-list.html" class="btn btn-outline-secondary">取消返回</a>
          <button type="submit" class="btn btn-success" id="btn-submit">
            <i class="bi bi-check-lg me-1"></i>確認新增
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const ctx = '/api/customers'; // 請確認您的 Controller 端點路徑

  function showMsg(text, type='danger') {
    document.getElementById('msg').innerHTML =
      `<div class="alert alert-${type} alert-dismissible shadow-sm mb-4" role="alert">
         ${text}
         <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
       </div>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function fillDemo() {
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const randLetter = letters.charAt(Math.floor(Math.random() * letters.length));
    const randGender = Math.random() > 0.5 ? "1" : "2";
    const randNums = Math.floor(Math.random() * 100000000).toString().padStart(8, '0');

    document.getElementById('f-name').value = '測試客戶' + Math.floor(Math.random() * 100);
    document.getElementById('f-idNumber').value = randLetter + randGender + randNums;
    document.getElementById('f-dob').value = '1990-05-15';
    document.getElementById('f-phone').value = '09' + Math.floor(Math.random() * 100000000).toString().padStart(8, '0');
    document.getElementById('f-email').value = 'test' + Math.floor(Math.random() * 1000) + '@example.com';
    document.getElementById('f-address').value = '台北市信義區市府路1號';
    document.getElementById('f-nationality').value = 'Taiwan';
    document.getElementById('f-income').value = '50000';
    document.getElementById('f-creditScore').value = '600';
  }

  async function createCustomer() {
    const btn = document.getElementById('btn-submit');
    const ogHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>處理中...';

    const payload = {
      name: document.getElementById('f-name').value.trim(),
      idNumber: document.getElementById('f-idNumber').value.trim(),
      dateOfBirth: document.getElementById('f-dob').value || null,
      phone: document.getElementById('f-phone').value.trim(),
      email: document.getElementById('f-email').value.trim(),
      address: document.getElementById('f-address').value.trim(),
      nationality: document.getElementById('f-nationality').value.trim(),
      income: Number(document.getElementById('f-income').value) || 0,
      creditScore: Number(document.getElementById('f-creditScore').value) || 0
    };

    try {
      const res = await fetch(ctx, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      if (res.status === 401) { window.location.href = 'login.html'; return; }
      
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showMsg(data.error || data.message || '新增失敗');
      } else {
        showMsg('<i class="bi bi-check-circle me-1"></i>新增成功！', 'success');
        document.getElementById('createForm').reset();
      }
    } catch (e) {
      showMsg('網路錯誤：' + e.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = ogHtml;
    }
  }

  async function doLogout() {
    if(!confirm('確定要登出系統嗎？')) return;
    try {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'login.html';
    } catch (e) { console.error('登出發生錯誤', e); }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
