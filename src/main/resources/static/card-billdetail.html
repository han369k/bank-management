<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>帳單明細</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-wrapper { max-width: 900px; margin: 32px auto; padding: 0 16px; }
    .summary-box { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; border: 1px solid #eee; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .summary-box .label { color: #888; margin-right: 6px; font-size: 12px; }
    .summary-box .value { font-weight: 600; color: #1a1d23; font-size: 14px; }
    .filter-bar { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 16px 24px; margin-bottom: 16px; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="index.html"><i class="bi bi-bank me-2"></i>Bank Management</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link" href="index.html">首頁</a>
      <a class="nav-link" href="card-list.html">信用卡</a>
      <a class="nav-link active" href="card-billcurrent.html">帳單</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="d-flex align-items-center gap-3 mb-3">
    <a href="card-billcurrent.html" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>返回帳單列表
    </a>
    <h1 class="page-title mb-0"><i class="bi bi-file-text me-2"></i>帳單明細</h1>
  </div>

  <div class="summary-box d-flex flex-wrap gap-4">
    <div><span class="label">帳單月份</span><span class="value">2026-03</span></div>
    <div><span class="label">總金額</span><span class="value">$ 3,500</span></div>
    <div><span class="label">已繳金額</span><span class="value">$ 3,500</span></div>
    <div><span class="label">剩餘應繳</span><span class="value text-success">$ 0</span></div>
  </div>

  <div class="filter-bar d-flex align-items-center gap-3">
    <form id="filterForm" method="get" action="#" class="d-flex align-items-center gap-2 mb-0">
      <label class="form-label mb-0">選擇卡片：</label>
      <select name="cardId" id="cardSelect" class="form-select form-select-sm" style="width:220px;">
        <option value="">全部卡片</option>
        <option value="1" selected>**** **** **** 3456</option>
        <option value="2">**** **** **** 8899</option>
      </select>
    </form>
  </div>

  <div class="card card-box p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
        <tr>
          <th>日期</th>
          <th>描述</th>
          <th class="text-end">金額</th>
        </tr>
        </thead>
        <tbody>
        <!-- Mock Transaction 1 -->
        <tr>
          <td class="font-monospace text-muted">2026-03-01</td>
          <td>星巴克線上儲值</td>
          <td class="text-end fw-bold text-danger">$ 500</td>
        </tr>
        <!-- Mock Transaction 2 -->
        <tr>
          <td class="font-monospace text-muted">2026-03-12</td>
          <td>Netflix 訂閱費用</td>
          <td class="text-end fw-bold text-danger">$ 390</td>
        </tr>
        <!-- Mock Transaction 3 -->
        <tr>
          <td class="font-monospace text-muted">2026-03-20</td>
          <td>新光三越量販店</td>
          <td class="text-end fw-bold text-danger">$ 2,610</td>
        </tr>
        <!-- Mock Transaction 4 (入帳) -->
        <tr>
          <td class="font-monospace text-muted">2026-03-25</td>
          <td>自動轉帳扣繳</td>
          <td class="text-end fw-bold text-success">-$ 3,500</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('cardSelect').addEventListener('change', function () {
    document.getElementById('filterForm').submit();
  });
</script>
</body>
</html>
