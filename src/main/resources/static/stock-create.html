<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增股票 - Bank Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 微調表單容器寬度，讓視覺更集中 */
    .page-wrapper { max-width: 600px; margin: 40px auto; padding: 0 16px; }
    .card-custom { border: 1px solid #eee; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .form-control:focus { border-color: #1a1d23; box-shadow: 0 0 0 0.25rem rgba(26, 29, 35, 0.1); }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="index.html"><i class="bi bi-bank me-2"></i>Bank Management</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link" href="index.html">首頁</a>
      <a class="nav-link" href="account-list.html">帳戶</a>
      <a class="nav-link" href="translog-search.html">交易紀錄</a>
      <a class="nav-link active" href="stock-getall.html">股票</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="page-title mb-1"><i class="bi bi-graph-up-arrow me-2"></i>新增股票</h2>
      <p class="text-muted small mb-0">輸入股票代碼與名稱以建立新資料</p>
    </div>
    <a href="stock-getall.html" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i>返回列表
    </a>
  </div>

  <div class="card card-custom p-2">
    <div class="card-body">
      <div id="alertMessage" class="alert d-none" role="alert"></div>

      <form id="insertForm">
        <div class="row g-3">
          <div class="col-md-5">
            <label for="stockId" class="form-label text-muted small fw-bold">股票代碼 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="stockId" required placeholder="例如: 2330" maxlength="10">
          </div>
          <div class="col-md-7">
            <label for="stockName" class="form-label text-muted small fw-bold">股票名稱 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="stockName" required placeholder="例如: 台積電">
          </div>

          <div class="col-12 mt-4 d-flex align-items-center">
            <button type="button" class="btn btn-outline-info me-auto" onclick="fillDemoData()">
              <i class="bi bi-magic me-1"></i>一鍵帶入
            </button>
            <button type="button" class="btn btn-light me-2" onclick="window.location.href='stock-getall.html'">取消</button>
            <button type="submit" class="btn btn-primary" id="btnSubmit">
              <i class="bi bi-check-lg me-1"></i>確認新增
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 一鍵帶入Demo假資料
  function fillDemoData() {
    // 準備一批資料庫預設沒有的熱門股票，避免 Primary Key 衝突
    const demoStocks = [
      { id: '0050', name: '元大台灣50' },
      { id: '2308', name: '台達電' },
      { id: '2886', name: '兆豐金' },
      { id: '2603', name: '長榮' },
      { id: '2382', name: '廣達' },
      { id: '0056', name: '元大高股息' },
      { id: '2303', name: '聯電' }
    ];

    // 隨機抽出一檔股票
    const randomStock = demoStocks[Math.floor(Math.random() * demoStocks.length)];

    // 帶入畫面
    document.getElementById('stockId').value = randomStock.id;
    document.getElementById('stockName').value = randomStock.name;

    // 清除可能殘留的錯誤或成功提示
    document.getElementById('alertMessage').classList.add('d-none');
  }

  // 表單送出邏輯
  document.getElementById('insertForm').addEventListener('submit', function (event) {
    event.preventDefault(); // 防止表單預設提交

    const btnSubmit = document.getElementById('btnSubmit');
    const alertBox = document.getElementById('alertMessage');
    const stockId = document.getElementById('stockId').value.trim();
    const stockName = document.getElementById('stockName').value.trim();

    // 禁用按鈕避免重複提交
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>處理中...';

    const params = JSON.stringify({
      stockId: stockId,
      stockName: stockName,
      status: "true"
    });

    fetch('Stock?method=Insert', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json; charset=UTF-8'
      },
      body: params
    })
            .then(response => {
              if (!response.ok) {
                throw new Error("網路回應不成功，狀態碼: " + response.status);
              }
              return response.text();
            })
            .then(() => {
              // 顯示成功訊息
              alertBox.className = 'alert alert-success d-flex align-items-center mb-3';
              alertBox.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i><div>股票 <strong>' + stockId + ' ' + stockName + '</strong> 新增成功！即將返回列表...</div>';
              alertBox.classList.remove('d-none');

              // 清空表單
              document.getElementById('insertForm').reset();

              // 1.5秒後導向列表頁
              setTimeout(() => {
                window.location.href = 'stock-getall.html';
              }, 1500);
            })
            .catch(error => {
              console.error("發生錯誤:", error);
              // 顯示錯誤訊息
              alertBox.className = 'alert alert-danger d-flex align-items-center mb-3';
              alertBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i><div>新增失敗，請檢查是否已有重複的股票代碼。</div>';
              alertBox.classList.remove('d-none');
            })
            .finally(() => {
              // 恢復按鈕狀態
              btnSubmit.disabled = false;
              btnSubmit.innerHTML = '<i class="bi bi-check-lg me-1"></i>確認新增';
            });
  });
</script>
</body>
</html>
