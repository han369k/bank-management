<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增股票 - Bank Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/bank_management/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/bank_management/index.html"><i class="bi bi-bank me-2"></i>Bank Management</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link" href="../index.html">首頁</a>
      <a class="nav-link" href="account-list.html">帳戶</a>
      <a class="nav-link" href="translog-search.html">交易紀錄</a>
      <a class="nav-link active" href="stock-getall.html">股票</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="page-title"><i class="bi bi-plus-circle me-2"></i>新增股票</h2>
        <p class="text-muted small mb-0">輸入股票代碼與名稱以建立新資料</p>
      </div>
      <a href="stock-getall.html" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>返回列表
      </a>
    </div>

    <div class="card card-custom">
      <div class="card-body p-4">
        <!-- 成功/錯誤訊息區塊 -->
        <div id="alertMessage" class="alert d-none" role="alert"></div>

        <form id="insertForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="stockId" class="form-label text-muted small">股票代碼 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="stockId" required placeholder="例如: 2330">
            </div>
            <div class="col-md-6">
              <label for="stockName" class="form-label text-muted small">股票名稱 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="stockName" required placeholder="例如: 台積電">
            </div>

            <div class="col-12 mt-4 text-end">
              <button type="button" class="btn btn-light me-2" onclick="window.location.href='stock-getall.html'">取消</button>
              <button type="submit" class="btn btn-primary" id="btnSubmit">
                <i class="bi bi-check-lg me-1"></i>確認新增
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('insertForm').addEventListener('submit', function (event) {
    event.preventDefault(); // 防止表單預設提交

    const btnSubmit = document.getElementById('btnSubmit');
    const alertBox = document.getElementById('alertMessage');
    const stockId = document.getElementById('stockId').value.trim();
    const stockName = document.getElementById('stockName').value.trim();

    // 禁用按鈕避免重複提交
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>處理中...';

    const params = JSON.stringify({
      stockId: stockId,
      stockName: stockName,
    });

    fetch('../Stock?method=Insert', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json; charset=UTF-8'
      },
      body: params
    })
    .then(response => {
      if (!response.ok) {
        throw new Error("網路回應不成功，狀態碼: " + response.status);
      }
      return response.text();
    })
    .then(() => {
      // 顯示成功訊息
      alertBox.className = 'alert alert-success d-flex align-items-center';
      alertBox.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i><div>股票 ' + stockId + ' 新增成功！即將返回列表...</div>';
      alertBox.classList.remove('d-none');

      // 清空表單
      document.getElementById('insertForm').reset();

      // 1.5秒後導向列表頁
      setTimeout(() => {
        window.location.href = 'stock-getall.html';
      }, 1500);
    })
    .catch(error => {
      console.error("發生錯誤:", error);
      // 顯示錯誤訊息
      alertBox.className = 'alert alert-danger d-flex align-items-center';
      alertBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i><div>新增失敗，請檢查輸入資料或聯絡管理員。</div>';
      alertBox.classList.remove('d-none');
    })
    .finally(() => {
      // 恢復按鈕狀態
      btnSubmit.disabled = false;
      btnSubmit.innerHTML = '<i class="bi bi-check-lg me-1"></i>確認新增';
    });
  });
</script>
</body>
</html>
