<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增帳戶</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="index.html"><i class="bi bi-bank me-2"></i>Bank Management</a>
    <div class="navbar-nav ms-3">
      <a class="nav-link" href="account-list.html">帳戶列表</a>
      <a class="nav-link" href="account-create.html">新增帳戶</a>
      <a class="nav-link" href="translog-search.html">交易紀錄</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="page-title">新增帳戶</div>

  <div id="msg"></div>

  <div class="card" style="max-width:520px">
    <div class="card-header">帳戶資料</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-12">
          <label>帳號 <span style="color:#aaa;font-weight:400;text-transform:none">（12碼）</span></label>
          <input id="f-account" class="form-control" type="text" maxlength="12" placeholder="例：000000000001">
        </div>
        <div class="col-12">
          <label>客戶 ID</label>
          <input id="f-customer" class="form-control" type="text" placeholder="客戶身分識別碼">
        </div>
        <div class="col-6">
          <label>類型</label>
          <select id="f-type" class="form-select">
            <option value="CURRENT">CURRENT（活期）</option>
            <option value="FIXED">FIXED（定期）</option>
          </select>
        </div>
        <div class="col-6">
          <label>幣別</label>
          <select id="f-currency" class="form-select">
            <option value="TWD">TWD（新台幣）</option>
            <option value="USD">USD（美元）</option>
            <option value="EUR">EUR（歐元）</option>
            <option value="GBP">GBP（英鎊）</option>
            <option value="JPY">JPY（日圓）</option>
            <option value="CHF">CHF（瑞士法郎）</option>
          </select>
        </div>
        <div class="col-12">
          <label>初始餘額</label>
          <input id="f-balance" class="form-control" type="number" min="0" step="1" placeholder="0">
        </div>
        <div class="col-12 d-flex gap-2 mt-2">
          <button class="btn btn-primary" onclick="createAccount()">
            <i class="bi bi-plus-lg me-1"></i>建立帳戶
          </button>
          <button class="btn btn-outline-secondary" onclick="clearForm()">清除</button>
          <button class="btn btn-outline-info ms-auto" onclick="fillDemoData()">
            <i class="bi bi-magic me-1"></i>一鍵帶入
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const ctx = '/accounts/api';

  function showMsg(text, type='danger') {
    document.getElementById('msg').innerHTML =
            `<div class="alert alert-${type} alert-dismissible" role="alert">
       ${text}
       <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
     </div>`;
  }

  function clearForm() {
    ['f-account','f-customer','f-balance'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-type').value     = 'CURRENT';
    document.getElementById('f-currency').value = 'TWD';
    document.getElementById('msg').innerHTML    = '';
  }

  // DEMO隨機生成
  function fillDemoData() {
    // 隨機產生後 9 碼，加上前面的 '808'，保證每次點擊帳號都不同，避免 PK 重複報錯
    const randomSuffix = Math.floor(Math.random() * 1000000000).toString().padStart(9, '0');

    document.getElementById('f-account').value = '808' + randomSuffix;
    document.getElementById('f-customer').value = '1';
    document.getElementById('f-type').value = 'FIXED';
    document.getElementById('f-currency').value = 'TWD';
    document.getElementById('f-balance').value = '150000';

    // 清掉之前的提示訊息
    document.getElementById('msg').innerHTML = '';
  }

  const v = id => document.getElementById(id).value.trim();

  async function createAccount() {
    if (!v('f-customer'))             { showMsg('客戶 ID 為必填'); return; }
    if (v('f-balance') === '' || Number(v('f-balance')) < 0) {
      showMsg('請輸入有效的初始餘額'); return;
    }

    const body = {
      customerId:      v('f-customer'),
      accountType:     v('f-type'),
      accountCurrency: v('f-currency'),
      balance:         Number(v('f-balance'))
    };

    try {
      const res  = await fetch(`${ctx}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) { showMsg(data.error || '建立失敗'); return; }

      // 成功後顯示綠色提示框，但不清除表單，二次確認剛剛建立的內容
      showMsg(`<i class="bi bi-check-circle me-1"></i>建立成功！帳戶已成功寫入資料庫。`, 'success');

    } catch(e) {
      showMsg('網路錯誤：' + e.message);
    }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
